<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>和平区一模数学试卷深度分析</title>
<style>
:root{--bg:#f5f1e8;--primary:#1a5276;--text:#1a1815;--muted:#6b6257;--card:#fbf8f1;--line:#d9cfbf;--good:#2f6b3b;--warn:#9b6b00;--bad:#8b2e2e;--accent:#1a5276;--accent-light:rgba(26,82,118,0.08);--accent-border:rgba(26,82,118,0.2)}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Serif SC","Source Han Serif SC",serif;color:var(--text);background:radial-gradient(circle at 20% 12%,rgba(26,82,118,0.08),transparent 28%),radial-gradient(circle at 82% 90%,rgba(26,82,118,0.06),transparent 26%),var(--bg);line-height:1.75}
.container{width:min(1120px,92vw);margin:28px auto 48px}
header{background:linear-gradient(135deg,var(--accent-light),rgba(245,241,232,0.9));border:1px solid var(--line);border-left:6px solid var(--primary);border-radius:14px;padding:24px 26px;box-shadow:0 8px 24px rgba(26,24,21,0.06)}
h1{margin:0 0 6px;font-size:clamp(1.6rem,2.7vw,2.3rem);letter-spacing:1px;color:var(--primary)}
.subtitle{margin:0;color:var(--muted);font-size:.98rem}
.meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:.88rem;color:var(--muted)}
nav{margin:18px 0 26px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
nav h2{margin:0 0 8px;font-size:1.02rem;color:var(--primary)}
.toc{margin:0;padding-left:18px;columns:2;column-gap:34px}
.toc li{margin:5px 0;break-inside:avoid}
.toc a{color:var(--text);text-decoration:none;border-bottom:1px dashed var(--accent-border)}
.toc a:hover{color:var(--primary)}
section{background:rgba(251,248,241,0.88);border:1px solid var(--line);border-radius:14px;margin-top:16px;padding:20px 22px;box-shadow:0 6px 20px rgba(26,24,21,0.04)}
h2{margin:0 0 14px;font-size:1.28rem;color:var(--primary);border-bottom:1px solid var(--accent-border);padding-bottom:8px}
h3{margin:16px 0 8px;font-size:1.06rem;color:#1a3d5c}
p{margin:8px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:10px}
.kpi-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi-title{color:var(--muted);font-size:.86rem;margin-bottom:3px}
.kpi-value{font-size:1.2rem;color:var(--primary);font-weight:700}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.94rem;background:#fffef9}
th,td{border:1px solid var(--line);padding:8px 9px;vertical-align:top}
th{background:#dce8f0;color:#1a3d5c;text-align:left;font-weight:700}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.module-card{border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:10px;background:#fffdf7;padding:12px}
.tag{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);margin-right:6px;margin-bottom:6px;color:#51493f;background:#f8f3e8}
.level-high{color:var(--bad);font-weight:700}
.level-mid{color:var(--warn);font-weight:700}
.level-low{color:var(--good);font-weight:700}
ul{margin:8px 0;padding-left:20px}
footer{margin-top:18px;color:var(--muted);font-size:.86rem;text-align:center}
.bar-chart{margin:12px 0}
.bar-row{display:flex;align-items:center;margin:6px 0}
.bar-label{width:120px;font-size:.88rem;text-align:right;padding-right:10px;flex-shrink:0}
.bar-track{flex:1;background:#e8e2d6;border-radius:6px;height:22px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:.78rem;color:#fff;font-weight:700;transition:width .3s}
.bar-fill.blue{background:linear-gradient(90deg,#1a5276,#2980b9)}
.bar-fill.green{background:linear-gradient(90deg,#1e8449,#27ae60)}
.bar-fill.orange{background:linear-gradient(90deg,#b7950b,#f1c40f);color:#5a4e00}
.bar-fill.red{background:linear-gradient(90deg,#922b21,#e74c3c)}
.card-highlight{background:linear-gradient(135deg,var(--accent-light),#f0ebe0);border:1px solid var(--accent-border);border-left:4px solid var(--primary);border-radius:10px;padding:14px 16px;margin:12px 0}
.card-highlight strong{color:var(--primary)}
.diff-easy{background:#d5f5e3;color:#1e8449;padding:2px 8px;border-radius:4px;font-size:.82rem;font-weight:700}
.diff-mid{background:#fef9e7;color:#9a7d0a;padding:2px 8px;border-radius:4px;font-size:.82rem;font-weight:700}
.diff-hard{background:#fadbd8;color:#922b21;padding:2px 8px;border-radius:4px;font-size:.82rem;font-weight:700}
@media(max-width:900px){.toc{columns:1}.grid-2{grid-template-columns:1fr}.bar-label{width:80px}}
</style>
